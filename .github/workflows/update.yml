name: update panic index

on:
  schedule:
    # 22:40 UTC Sun-Thu = 06:40 Beijing Mon-Fri, ~50 min before the briefing
    # runs, so the data is always fresh when the briefing reads it.
    - cron: "40 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compute readings
        run: |
          python briefing_panic.py --out data/panic-block.html
          python briefing_panic.py --json > data/panic.json
          python quotes.py > data/quotes-block.html

      - name: Commit if changed
        run: |
          git config user.name  "panic-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
